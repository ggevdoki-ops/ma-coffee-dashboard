<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Coffee Network — статус смен</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Archivo:wght@400;500;600;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- крафтовая текстура поверх фона -->
<div class="grain" aria-hidden="true"></div>

<!-- экран ввода PIN -->
<div id="gate" class="gate hidden">
  <form id="gate-form" class="gate-card">
    <div class="gate-stamp">COFFEE<br>NETWORK</div>
    <label class="gate-label" for="pin-input">Код доступа</label>
    <input id="pin-input" class="gate-input" inputmode="numeric" autocomplete="off" placeholder="• • • •" autofocus>
    <button type="submit" class="gate-btn">Войти</button>
    <div id="gate-error" class="gate-error"></div>
  </form>
</div>

<!-- основной дашборд -->
<main id="board" class="hidden">

  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">COFFEE&nbsp;NETWORK</span>
    </div>
    <div class="topbar-live">
      <span id="live-dot" class="live-dot"></span>
      <span class="live-text">LIVE</span>
    </div>
    <div class="topbar-meta">
      <span id="clock" class="clock">--:--</span>
      <span class="meta-sep">·</span>
      <span id="today-label" class="today-label">—</span>
    </div>
  </header>

  <!-- сетка точек -->
  <section class="points" id="points"></section>

  <!-- нижняя панель: сеть + отклонения -->
  <section class="bottom">

    <div class="panel panel-network">
      <div class="panel-tag">СЕТЬ · СЕГОДНЯ</div>
      <div class="net-total">
        <span id="net-today" class="net-num">—</span>
        <span class="net-cur">₽</span>
      </div>
      <div class="net-sub" id="net-sub">
        <div class="net-sub-item">
          <span class="nsi-k">открыто точек</span>
          <span id="net-open" class="nsi-v">—</span>
        </div>
      </div>
    </div>

    <div class="panel panel-alerts">
      <div class="panel-tag">ОТКЛОНЕНИЯ ОТ ГРАФИКА</div>
      <div id="alerts" class="alerts"></div>
    </div>

  </section>

  <footer class="footer">
    <span id="updated" class="updated">обновляется…</span>
    <span class="footer-sep">·</span>
    <span class="footer-src">FusionPOS · обновление раз в 60с</span>
  </footer>

</main>

<script src="js/app.js"></script>
</body>
</html>
